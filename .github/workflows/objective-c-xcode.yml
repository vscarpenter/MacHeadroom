name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and analyze
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and analyze
        # Runners have no signing certificate for the team, so signing is
        # disabled; entitlements are only embedded at signing time, so the
        # sandboxed app still builds and analyzes cleanly.
        run: |
          set -o pipefail
          xcodebuild clean build analyze \
            -project MacHeadroom.xcodeproj \
            -scheme MacHeadroom \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify
